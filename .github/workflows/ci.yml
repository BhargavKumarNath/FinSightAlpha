name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # Fail fast, cheapest checks first.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tools
        run: pip install ruff==0.16.7 pyright==1.1.414

      # Blocking: catches real bugs (syntax errors, undefined names). Passes
      # cleanly today and should stay required going forward.
      - name: Ruff - correctness rules (blocking)
        run: ruff check . --select E9,F821,F822,F823

      # Informational only for now: the codebase predates ruff/pyright
      # adoption (410 default-ruleset findings, 35/39 files unformatted, 64
      # pyright errors as of Phase 5) and fixing that backlog is unrelated
      # to this refactor. Output stays visible in the CI log so a future,
      # dedicated cleanup pass can tighten these to blocking.
      - name: Ruff - full lint report (informational)
        run: ruff check . || true
      - name: Ruff - format check report (informational)
        run: ruff format --check . || true
      - name: Pyright - type check report (informational)
        run: pyright src/ tests/ || true

  # Parser + chunker correctness against the real committed filing.
  # No live-index/data files touched.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements-backend.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-backend.txt
          pip install pytest==9.1.1

      - name: Run unit tests
        run: python -m pytest tests/test_optimization.py tests/test_ingestion.py -v

  # Cheap, no model downloads: fails loudly if data/raw/ changes without a
  # rebuilt index (the exact class of drift fixed in Phase 1).
  data-validation:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements-backend.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-backend.txt
          pip install pytest==9.1.1

      - name: Verify registry / Qdrant / BM25 chunk counts agree
        run: python -m pytest tests/test_retrieval.py -v -m "not integration"

  # Slow: loads the embedding + cross-encoder models and runs a real
  # end-to-end hybrid search. Main-only (push) so PRs stay fast; can also
  # be run manually via workflow_dispatch.
  integration-smoke:
    runs-on: ubuntu-latest
    needs: [unit-tests, data-validation]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements-backend.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-backend.txt
          pip install pytest==9.1.1

      - name: Run end-to-end retrieval smoke test
        run: python -m pytest tests/ -v -m integration
